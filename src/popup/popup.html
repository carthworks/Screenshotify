<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Screenshotify</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="popup-header">
      <div class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="3" y="3" width="18" height="18" rx="2" stroke="currentColor" stroke-width="2"/>
          <circle cx="12" cy="12" r="3" fill="currentColor"/>
        </svg>
        <h1>Screenshotify</h1>
      </div>
      <button id="settingsBtn" class="icon-btn" title="Settings" aria-label="Open settings">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 1v6m0 6v6m9-9h-6m-6 0H3"/>
        </svg>
      </button>
    </header>

    <main class="popup-main">
      <button id="captureBtn" class="primary-btn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
        <span>Quick Capture</span>
        <kbd>Ctrl+Shift+S</kbd>
      </button>

      <div class="divider">
        <span>Recent Captures</span>
      </div>

      <div id="historyContainer" class="history-container">
        <div class="empty-state">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
          <p>No captures yet</p>
          <small>Click "Quick Capture" to get started</small>
        </div>
      </div>

      <button id="clearHistoryBtn" class="secondary-btn" style="display: none;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
        </svg>
        Clear History
      </button>
    </main>

    <footer class="popup-footer">
      <a href="#" id="helpBtn" class="footer-link">Help</a>
      <span class="footer-divider">•</span>
      <a href="#" id="aboutBtn" class="footer-link">About</a>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
